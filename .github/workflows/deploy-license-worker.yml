name: Deploy LockTimer License API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "license-api/**"
      - ".github/workflows/deploy-license-worker.yml"

permissions:
  contents: read

concurrency:
  group: locktimer-license-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate D1 and deploy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: license-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID ADMIN_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Configure D1 database ID
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("wrangler.toml")
          content = path.read_text()
          database_id = os.environ["D1_DATABASE_ID"].strip()
          if not database_id:
              raise SystemExit("D1_DATABASE_ID is empty")
          content = content.replace("REPLACE_WITH_D1_DATABASE_ID", database_id)
          if 'database_id = "' + database_id + '"' not in content:
              raise SystemExit("Could not configure D1 database_id")
          path.write_text(content)
          PY

      - name: Apply D1 schema
        run: npx wrangler d1 execute locktimer-license --remote --file=./schema.sql --config ./wrangler.toml

      - name: Set Worker admin secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN --config ./wrangler.toml

      - name: Deploy Worker
        run: npx wrangler deploy --config ./wrangler.toml

      - name: Verify Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://locktimer-license.khahdihdz.workers.dev/api/health
          echo
