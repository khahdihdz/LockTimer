name: Manage License Keys

on:
  workflow_dispatch:
    inputs:
      action:
        description: Operation
        type: choice
        required: true
        default: create
        options:
          - create
          - list
          - revoke
      count:
        description: Number of keys to create (1-200)
        type: number
        required: true
        default: 10
      days:
        description: Validity (0 = lifetime)
        type: choice
        required: true
        default: "0"
        options:
          - "7"
          - "30"
          - "90"
          - "365"
          - "0"
      max_devices:
        description: Maximum devices per key (1-10)
        type: number
        required: true
        default: 1
      license_id:
        description: License database ID (required for revoke)
        type: string
        required: false

permissions:
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Manage licenses
        id: manage
        env:
          ADMIN_TOKEN: \${{ secrets.ADMIN_TOKEN }}
          ACTION: \${{ inputs.action }}
          COUNT: \${{ inputs.count }}
          DAYS: \${{ inputs.days }}
          MAX_DEVICES: \${{ inputs.max_devices }}
          LICENSE_ID: \${{ inputs.license_id }}
          API_BASE: https://locktimer-license.khahdihdz.workers.dev
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const base = process.env.API_BASE;
          const headers = {
            'Authorization': 'Bearer ' + process.env.ADMIN_TOKEN,
            'Content-Type': 'application/json'
          };

          async function request(path, options = {}) {
            const response = await fetch(base + path, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error('API HTTP ' + response.status + ': ' + JSON.stringify(data));
            }
            return data;
          }

          (async () => {
            if (!process.env.ADMIN_TOKEN) throw new Error('Missing GitHub secret ADMIN_TOKEN');

            if (process.env.ACTION === 'create') {
              const count = Number(process.env.COUNT);
              const days = Number(process.env.DAYS);
              const maxDevices = Number(process.env.MAX_DEVICES);
              if (!Number.isInteger(count) || count < 1 || count > 200) throw new Error('count must be 1-200');
              if (![0, 7, 30, 90, 365].includes(days)) throw new Error('Unsupported validity period');
              if (!Number.isInteger(maxDevices) || maxDevices < 1 || maxDevices > 10) throw new Error('max_devices must be 1-10');

              const data = await request('/api/admin/keys', {
                method: 'POST',
                body: JSON.stringify({ count, days, maxDevices })
              });
              if (!Array.isArray(data.keys) || data.keys.length !== count) throw new Error('Unexpected API response: keys were not returned');

              const lines = [
                'LockTimer License Keys',
                'Created: ' + new Date().toISOString(),
                'Count: ' + data.keys.length,
                'Validity days: ' + (days === 0 ? 'Lifetime' : days),
                'Maximum devices per key: ' + maxDevices,
                '',
                ...data.keys.map((item, index) =>
                  (index + 1) + '. ' + item.key +
                  ' | expiresAt=' + (item.expiresAt ?? 'lifetime') +
                  ' | maxDevices=' + item.maxDevices
                )
              ];
              fs.writeFileSync('locktimer-license-keys.txt', lines.join('\n') + '\n', { mode: 0o600 });
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                '## License keys created\n\n' +
                '- Quantity: **' + data.keys.length + '**\n' +
                '- Validity: **' + (days === 0 ? 'Lifetime' : days + ' days') + '**\n' +
                '- Devices per key: **' + maxDevices + '**\n\n' +
                'Download the generated keys artifact below. Raw keys are intentionally not printed in the Actions log.\n'
              );
              console.log('Successfully created ' + data.keys.length + ' license keys. Download the workflow artifact to retrieve them.');
            } else if (process.env.ACTION === 'list') {
              const data = await request('/api/admin/keys');
              const licenses = Array.isArray(data.licenses) ? data.licenses : [];
              const rows = [
                '| ID | Fingerprint | Status | Expiration | Max devices |',
                '|---:|---|---|---|---:|',
                ...licenses.map(x => '| ' + x.id + ' | ' + x.fingerprint + ' | ' + x.status + ' | ' +
                  (x.expires_at ? new Date(x.expires_at * 1000).toISOString() : 'Lifetime') + ' | ' + x.max_devices + ' |')
              ];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                '## License inventory\n\n' + rows.join('\n') + '\n\nOnly fingerprints are shown; raw keys are never stored by the API.\n'
              );
              console.log('Listed ' + licenses.length + ' license records.');
            } else if (process.env.ACTION === 'revoke') {
              const id = String(process.env.LICENSE_ID || '').trim();
              if (!/^\d+$/.test(id)) throw new Error('Enter a numeric license_id');
              await request('/api/admin/keys/' + id, {
                method: 'PATCH',
                body: JSON.stringify({ status: 'revoked' })
              });
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                '## License revoked\n\nLicense database ID: **' + id + '**\n'
              );
              console.log('Revoked license ID ' + id + '.');
            } else {
              throw new Error('Unknown operation');
            }
          })().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Upload generated keys
        if: inputs.action == 'create' && success()
        uses: actions/upload-artifact@v4
        with:
          name: locktimer-license-keys
          path: locktimer-license-keys.txt
          if-no-files-found: error
          retention-days: 30
