name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build assembleRelease rồi zipalign + apksigner sign với keystore dùng chung
  # của repo khahdihdz/apksign.
  build-sign:
    uses: khahdihdz/apksign/.github/workflows/android-shared-signing.yml@main
    with:
      project-dir: "."
      gradle-task: "assembleRelease"
    secrets: inherit

  release:
    needs: build-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Cannot read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Download signed APKs
        uses: actions/download-artifact@v4
        with:
          name: android-signed-apks
          path: signed-apks

      - name: Rename APK with version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          apk="$(find signed-apks -name '*.apk' -type f | sort | head -1)"
          if [ -z "$apk" ]; then
            echo "No APK found in signed-apks:"
            ls -la signed-apks
            exit 1
          fi
          mv "$apk" "signed-apks/LockTimer-${TAG}.apk"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            signed-apks/LockTimer-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
          make_latest: true
